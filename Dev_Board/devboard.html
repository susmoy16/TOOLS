<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: { brand: '#4B39EF', brandsoft: '#EEF0FF' }
      }
    }
  }
</script>
<style>
  :root{
    color-scheme: light;
    --page-bg: #EEF1FA;
    --ink: #0F172A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    background: var(--page-bg);
    color: var(--ink);
    transition: background-color .35s ease;
    font-family: 'Poppins', system-ui, sans-serif;
  }
  .dashed{ border-top: 1px dashed #E2E8F0; }
  .log-enter{ animation: pop .25s ease-out; }
  @keyframes pop{ from{ opacity:0; transform: translateY(-6px);} to{ opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }
  :focus-visible{ outline: 2px solid #4B39EF; outline-offset: 2px; border-radius: 6px; }
  #logList::-webkit-scrollbar{ width: 6px; }
  #logList::-webkit-scrollbar-thumb{ background: #CBD5E1; border-radius: 99px; }
</style>
</head>
<body class="min-h-screen">

<!--Dev Board-->
<div id="deskView" class="max-w-6xl mx-auto px-3 sm:px-5 py-5">

  <!--Navbar-->
  <header class="bg-white rounded-2xl px-4 sm:px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <img src="main logo.jpeg" alt="DevBoard logo" class="w-9 h-9">
      <span class="text-lg sm:text-xl font-medium">Dev<span class="font-bold">Board</span></span>
    </div>

    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-brandsoft rounded-lg px-3 py-1.5">
        <span class="w-5 h-5 rounded bg-brand flex items-center justify-center">
          <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
        </span>
        <span id="completedCount" class="font-semibold text-slate-700">0</span>
      </div>
      <button id="themeBtn" title="Change background colour" class="w-9 h-9 rounded-full active:scale-95 hover:rotate-45 transition">
        <img src="colour changing logo.jpeg" alt="Change background colour" class="w-full h-full">
      </button>
    </div>
  </header>

  <!--Body-->
  <div class="mt-4 flex flex-col lg:flex-row gap-4 lg:items-stretch">

    <!--main -->
    <main class="flex-1 w-full bg-white/70 rounded-2xl p-4 sm:p-5">
      <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-[1fr_1.7fr_1fr] gap-4">
        <div class="bg-brandsoft rounded-xl px-5 py-6 flex items-center gap-3">
          <span class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center shrink-0">
            <svg viewBox="0 0 24 24" class="w-4.5 h-4.5" width="18" height="18" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
          </span>
          <div>
            <p class="text-sm text-slate-500">Task Assigned</p>
            <p id="assignedCount" class="text-2xl font-bold leading-tight">0</p>
          </div>
        </div>

        <button id="discoverBtn"
          class="rounded-xl px-5 py-6 text-white font-semibold text-lg sm:text-xl flex items-center justify-center gap-3
                 bg-gradient-to-r from-[#4B39EF] to-[#8C7CFF] hover:brightness-105 active:scale-[.99] transition shadow">
          <img src="discover something new logo.jpeg" alt="" class="w-12 h-12 shrink-0">
          <span>Discover Something New Today!</span>
        </button>

        <div class="bg-brandsoft rounded-xl px-5 py-6 flex items-center gap-3">
          <img src="date logo.jpeg" alt="" class="w-7 h-7 shrink-0">
          <div>
            <p id="liveDate" class="text-lg sm:text-xl font-bold leading-tight"></p>
            <p id="liveTime" class="text-sm text-slate-500"></p>
          </div>
        </div>
      </section>

      <div class="dashed my-5"></div>

      <!--Task cards-->
      <section id="taskGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></section>
    </main>

    <!--Activity log-->
    <aside class="w-full lg:w-80 shrink-0 bg-white rounded-2xl p-5 shadow-sm flex flex-col min-h-[360px]">
      <div class="flex items-center justify-center gap-2 text-slate-700">
        <img src="active log logo.jpeg" alt="" class="w-5 h-5">
        <h2 class="font-semibold">Activity Log</h2>
      </div>
      <div class="flex justify-center mt-3">
        <button id="clearBtn" class="bg-brand text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-[#3d2cd6] active:scale-95 transition">
          Clear History
        </button>
      </div>
      <div class="dashed my-4"></div>
      <div id="logList" class="space-y-3 flex-1 min-h-0 overflow-y-auto pr-1">
        <p id="logEmpty" class="text-sm text-slate-400 text-center py-6">Finish a task to start your log.</p>
      </div>
    </aside>
  </div>
</div>

<!--BLOGS-->
<div id="blogView" class="hidden min-h-screen bg-[#EEF1FA]">
  <div class="max-w-5xl mx-auto px-3 sm:px-5 py-5">
    <header class="bg-white rounded-2xl px-4 sm:px-6 py-4 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-3">
        <img src="main logo.jpeg" alt="DevBoard logo" class="w-11 h-11">
        <span class="text-2xl font-medium">Dev<span class="font-bold">Board</span></span>
      </div>
      <button id="backBtn" class="bg-brand text-white font-semibold px-5 py-3 rounded-lg hover:bg-[#3d2cd6] active:scale-95 transition">
        Back to Desk
      </button>
    </header>

    <h1 class="text-center text-2xl font-bold my-7">Blogs</h1>
    <div id="blogList" class="space-y-5 pb-10"></div>
  </div>
</div>

<script src="devboard.js"></script>
</body>
</html>
